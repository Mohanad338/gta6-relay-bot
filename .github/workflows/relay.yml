name: GTA6AR Relay Bot

on:
  schedule:
    - cron: "0 */5 * * *"   # كل 5 ساعات (كل تشغيل يبقى شغال ~5:40 ساعة كاستماع مباشر)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: relay-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gta6_relay_bot.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git pull --rebase origin main
          git push
